name: Publish to npm

on:
  # Publish automatically when semantic-release cuts a GitHub release.
  #
  # This fires only because release.yml runs semantic-release with RELEASE_TOKEN
  # rather than the default GITHUB_TOKEN: GitHub deliberately suppresses events
  # raised by GITHUB_TOKEN so a workflow cannot trigger further workflows. Since
  # release.yml falls back (`secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN`),
  # removing that secret would leave releases working while publishing SILENTLY
  # stopped — the failure mode is a package that quietly stops reaching npm.
  release:
    types: [published]

  # Retained for backfill, dry runs, and republishing a specific ref — use the
  # "Run workflow" button in GitHub Actions.
  #
  # Note `inputs` is empty on a release trigger: dry-run is then not `true` so the
  # real publish runs, and the empty tag falls through to the version-based rule
  # below (prerelease -> next, otherwise latest).
  workflow_dispatch:
    inputs:
      tag:
        description: "npm dist-tag"
        required: false
        type: choice
        default: latest
        options:
          - latest
          - next
          - beta
          - alpha
      dry-run:
        description: "Dry run (validate without publishing)"
        required: false
        type: boolean
        default: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write

    env:
      SN_CRED_STORE: file
      SN_CRED_STORE_ALLOW_PLAINTEXT: "1"
      SN_CRED_STORE_PATH: ${{ github.workspace }}/.tmp-credentials.json

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Determine dist-tag and check version
        id: dist-tag
        run: |
          VERSION=$(node -e 'console.log(require("./package.json").version)')
          PACKAGE_NAME=$(node -e 'console.log(require("./package.json").name)')

          # Republishing an existing version is a hard error on npm; skip instead.
          if npm view "${PACKAGE_NAME}@${VERSION}" version 2>/dev/null; then
            echo "Version ${VERSION} already exists on npm — skipping publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif echo "$VERSION" | grep -qE "(alpha|beta|rc|next)"; then
            echo "tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish (dry run)
        if: inputs.dry-run == true && steps.dist-tag.outputs.skip != 'true'
        # No NODE_AUTH_TOKEN: this package publishes via a Trusted Publisher
        # (OIDC), which npm derives from the id-token permission above. npmjs is
        # phasing token-based publishing out — if publishing breaks, fix the
        # trusted publisher config on npmjs rather than reintroducing a secret.
        run: npm publish --tag "${{ steps.dist-tag.outputs.tag }}" --dry-run

      - name: Publish
        if: inputs.dry-run != true && steps.dist-tag.outputs.skip != 'true'
        # See the dry-run step above: Trusted Publisher (OIDC), no token. The
        # same OIDC identity is what makes --provenance possible.
        run: npm publish --tag "${{ steps.dist-tag.outputs.tag }}" --provenance

      - name: Summary
        if: inputs.dry-run != true && steps.dist-tag.outputs.skip != 'true'
        run: echo "Published @sonisoft/sn-credstore@${{ steps.dist-tag.outputs.version }} with tag '${{ steps.dist-tag.outputs.tag }}'" >> "$GITHUB_STEP_SUMMARY"
